/* Begin PBXShellScriptBuildPhase section */
		378D1E102F7571CB0021BBAF /* Copy mimi-backend */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Copy mimi-backend";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -e\n\n# ===== mimi-backend (PyInstaller bundle) =====\nBACKEND_SRC=\"$SRCROOT/../mimi-backend/dist/mimi-backend\"\nBACKEND_DST=\"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/mimi-backend\"\n\nif [ -d \"$BACKEND_SRC\" ]; then\n    echo \"Copying mimi-backend into .app bundle (~607MB)...\"\n    rm -rf \"$BACKEND_DST\"\n    mkdir -p \"$BACKEND_DST\"\n    ditto \"$BACKEND_SRC\" \"$BACKEND_DST\"\n    chmod +x \"$BACKEND_DST/mimi-backend\"\n    if [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ]; then\n        echo \"Signing backend launcher\"\n        codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \\\n            --entitlements \"$SRCROOT/MimiApp/MimiBackend.entitlements\" \\\n            --timestamp=none \"$BACKEND_DST/mimi-backend\"\n    fi\nelse\n    echo \"warning: $BACKEND_SRC not found — Debug build falls back to manual 'python server.py'\"\nfi\n\n# ===== ollama (官方独立二进制 + MLX Metal runtime) =====\nOLLAMA_SRC=\"$SRCROOT/external/ollama\"\nOLLAMA_DST=\"$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/ollama-bin\"\n\nif [ -d \"$OLLAMA_SRC\" ] && [ -f \"$OLLAMA_SRC/ollama\" ]; then\n    echo \"Copying ollama into .app bundle (~377MB)...\"\n    rm -rf \"$OLLAMA_DST\"\n    mkdir -p \"$OLLAMA_DST\"\n    ditto \"$OLLAMA_SRC\" \"$OLLAMA_DST\"\n    chmod +x \"$OLLAMA_DST/ollama\"\n    if [ -n \"$EXPANDED_CODE_SIGN_IDENTITY\" ]; then\n        echo \"Signing ollama + bundled dylibs\"\n        # 先签所有 .dylib / .so（含 mlx_metal_v3/v4 子目录），然后签 ollama 主二进制\n        find \"$OLLAMA_DST\" \\( -name \"*.dylib\" -o -name \"*.so\" \\) -type f -print0 | \\\n            xargs -0 -n 1 codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \\\n                --timestamp=none 2>/dev/null || true\n        codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" \\\n            --entitlements \"$SRCROOT/MimiApp/MimiBackend.entitlements\" \\\n            --timestamp=none \"$OLLAMA_DST/ollama\"\n    fi\nelse\n    echo \"warning: $OLLAMA_SRC/ollama not found — bundled-ollama mode disabled\"\n    echo \"  to enable, run: curl -L https://github.com/ollama/ollama/releases/latest/download/ollama-darwin.tgz | tar xz -C mimi-app/external/ollama/\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

