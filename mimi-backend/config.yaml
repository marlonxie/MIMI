# MIMI 面试助手配置文件

server:
  host: "127.0.0.1"
  port: 8765

# 用户语言偏好（同时驱动 STT 识别和翻译）
# 未来前端接入后可由 WebSocket 消息按 session 覆盖
user:
  # 面试语言 — 音频/STT 识别的目标语言 (en / de / ...)
  # 锁定后彻底绕开 Whisper auto-detect，避免 Welsh/其他低资源语言幻觉
  # 设为 null → 自动检测（不推荐，详见 git log commit 95d5f1b）
  interview_language: "en"
  # 用户母语 — 翻译输出语言 (zh / en / ...)
  # 目前翻译 prompt 硬编码为英→中，切换其他 native 语言需同步改 prompt
  native_language: "zh"

stt:
  # whisper 模型大小: tiny, base, small, medium, large
  # M2 Pro 16GB 推荐 small（速度和精度平衡）
  model_size: "small"

translator:
  # provider: "gemini" 或 "claude"
  provider: "gemini"
  # Gemini 模型（改 provider 时同步改 model）
  # gemini: gemini-2.5-flash / gemini-2.5-pro / gemini-2.0-flash
  # claude: claude-sonnet-4-20250514
  model: "gemini-2.5-flash"

conversation:
  # 上下文窗口大小（最近 N 句对话）
  context_window_size: 10
  # 是否启用 RAG 回答提示（false = 只翻译，不生成答案建议）
  enable_suggestion: false
  # 面试官最后一句后等几秒再触发回答提示（debounce）
  suggestion_debounce: 3.0
  # 对话记录导出路径
  export_path: "./transcripts"

rag:
  # embedding 模型（本地运行，22MB）
  embedding_model: "all-MiniLM-L6-v2"
  # 检索返回的文档数量
  top_k: 3
  # 检索类型: similarity 或 mmr（最大边际相关性，结果更多样化）
  search_type: "mmr"
  # 文档切片大小
  chunk_size: 500
  # 切片重叠
  chunk_overlap: 50
  # ChromaDB 存储路径
  chroma_path: "./rag/chroma_store"
  # 资料目录（相对于项目根目录）
  resources_path: "../resources"

audio:
  # 采样率
  sample_rate: 16000
  # 每次发送的音频块大小（秒）—— 流式 STT 的更新周期
  # 1.0s 是 LocalAgreement-2 的标准值，首字延迟 ~2s。前端 AudioCapture.swift 也要同步改
  chunk_duration: 1.0
