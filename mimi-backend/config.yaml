# MIMI 面试助手配置文件

server:
  host: "127.0.0.1"
  port: 8765

# 用户语言偏好（同时驱动 STT 识别和翻译）
# 未来前端接入后可由 WebSocket 消息按 session 覆盖
user:
  # 面试语言 — 音频/STT 识别的目标语言 (en / de / ...)
  # 锁定后彻底绕开 Whisper auto-detect，避免 Welsh/其他低资源语言幻觉
  # 设为 null → 自动检测（不推荐，详见 git log commit 95d5f1b）
  interview_language: "en"
  # 用户母语 — 翻译输出语言 (zh / en / ...)
  # 目前翻译 prompt 硬编码为英→中，切换其他 native 语言需同步改 prompt
  native_language: "zh"

stt:
  # whisper 模型大小: tiny, base, small, medium, large
  # M2 Pro 16GB 推荐 small（速度和精度平衡）
  model_size: "small"

translator:
  # provider: "gemini" / "claude" / "openai" / "ollama"
  # 缺 cloud key 时自动 fallback 到 ollama（本地 Qwen3）
  provider: "gemini"
  # 改 provider 时同步改 model：
  # gemini: gemini-2.5-flash / gemini-2.5-pro / gemini-2.0-flash
  # claude: claude-sonnet-4-5-20250929
  # openai: gpt-5-mini (默认) / gpt-5.4-mini / gpt-4.1-mini
  # ollama: qwen3:4b-instruct-2507-q4_K_M
  model: "gemini-2.5-flash"

llm:
  # bundled ollama daemon 监听地址。BackendLauncher 起 ollama serve 时指定 OLLAMA_HOST=127.0.0.1:11435
  # 避开默认 11434（用户机器可能已有自己的 brew ollama daemon）。
  # 也可用环境变量 MIMI_OLLAMA_BASE_URL 覆盖（dev 走系统 ollama 时方便）。
  ollama_base_url: "http://127.0.0.1:11435"

conversation:
  # 上下文窗口大小（最近 N 句对话）
  context_window_size: 10
  # 是否启用 RAG 回答提示（false = 只翻译，不自动生成答案建议；但 manual 触发仍可用）
  enable_suggestion: false
  # Auto path 的短 debounce（让面试官连续句子归并进同一次触发）
  suggestion_debounce: 1.5
  # 三层 pipeline 第二层：LLM 判定这句是否值得生成建议（过滤寒暄/过渡语）
  # 关掉 → 退化成"每句过 local filter 就触发 RAG"
  intent_gate: true
  # 对话记录默认导出目录（仅 CLI / 测试走这里；UI 走 NSSavePanel 用户自选路径）
  # `~` 自动 expanduser；macOS 标准 app 私有数据位置
  export_path: "~/Library/Application Support/MIMI/transcripts"

rag:
  # embedding 模型（本地运行，22MB）
  embedding_model: "all-MiniLM-L6-v2"
  # 检索返回的文档数量
  top_k: 3
  # 检索类型: similarity 或 mmr（最大边际相关性，结果更多样化）
  search_type: "mmr"
  # 文档切片大小
  chunk_size: 500
  # 切片重叠
  chunk_overlap: 50
  # ChromaDB 向量库存储路径（macOS 标准 app 私有数据位置）
  chroma_path: "~/Library/Application Support/MIMI/chroma_store"
  # RAG 资料目录：前端上传 + 后端 indexer 读 + RAG engine 检索
  # 用户首次手动一次：cp ./resources/* ~/Library/Application\ Support/MIMI/resources/
  resources_path: "~/Library/Application Support/MIMI/resources"

audio:
  # 采样率
  sample_rate: 16000
  # 每次发送的音频块大小（秒）—— 流式 STT 的更新周期
  # 1.0s 是 LocalAgreement-2 的标准值，首字延迟 ~2s。前端 AudioCapture.swift 也要同步改
  chunk_duration: 1.0
